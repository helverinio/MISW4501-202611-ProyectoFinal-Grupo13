<header class="private-header">
  <div class="container private-header__content">
    <app-brand-logo />

    <div class="private-header__actions">
      <a routerLink="/app/home-search" class="private-header__link">{{ t('nav.dashboard') }}</a>
      <span class="private-header__user">{{ currentUser()?.nombre || currentUser()?.email }}</span>
      <button type="button" class="private-header__logout" (click)="logout()">
        {{ t('nav.logout') }}
      </button>
    </div>
  </div>
</header>
