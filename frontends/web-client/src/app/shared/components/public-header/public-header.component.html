<header class="public-header">
  <div class="public-header__container">
    <div class="public-header__content">
      <app-brand-logo />

      <div class="public-header__actions">
        <div class="public-header__selectors">
          <select
            (ngModelChange)="onLanguageChange($event)"
            [ngModel]="currentLanguage()"
            class="public-header__select"
          >
            @for (lang of languages; track lang.value) {
              <option [value]="lang.value">{{ lang.label }}</option>
            }
          </select>
          <select (ngModelChange)="currency.set($event)" [ngModel]="currency()" class="public-header__select">
            @for (curr of currencies; track curr) {
              <option [value]="curr">{{ curr }}</option>
            }
          </select>
        </div>

        <button class="public-header__back" type="button" routerLink="/">
          {{ t('nav.backToHome') }}
        </button>
      </div>
    </div>
  </div>
</header>
