<section class="login-page">
  <div class="login-page__grid">
    <div class="login-page__image" id="auth-image">
      <div class="login-page__image-wrapper">
        <img
          class="login-page__photo"
          src="https://storage.googleapis.com/uxpilot-auth.appspot.com/7a7768b916-14204645714f19159e3b.png"
          alt="elegant hotel reception desk with friendly staff welcoming guests, modern luxury lobby, warm lighting, professional atmosphere"
        />
        <div class="login-page__badge login-page__badge--secure">
          <div class="login-page__badge-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" />
              <path d="M10 17l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z" fill="white" />
            </svg>
          </div>
          <div>
            <div class="login-page__badge-title">{{ t('login.secure') }}</div>
            <div class="login-page__badge-subtitle">{{ t('login.secureDesc') }}</div>
          </div>
        </div>
        <div class="login-page__badge login-page__badge--users">
          <div class="login-page__badge-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
            </svg>
          </div>
          <div>
            <div class="login-page__badge-title">{{ t('login.users') }}</div>
            <div class="login-page__badge-subtitle">{{ t('login.usersSubtitle') }}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="login-page__form-wrapper" id="auth-form-container">
      <div class="login-page__header">
        <h1>{{ t('login.title') }}</h1>
        <p>{{ t('login.subtitle') }}</p>
      </div>

      <div class="login-page__tabs" id="auth-tabs">
        <button
          type="button"
          [class.is-active]="activeTab() === 'signin'"
          (click)="setTab('signin')"
          id="signin-tab"
          class="login-page__tab"
        >
          {{ t('login.signIn') }}
        </button>
        <button
          type="button"
          [class.is-active]="activeTab() === 'signup'"
          (click)="setTab('signup')"
          id="signup-tab"
          class="login-page__tab"
        >
          {{ t('login.createAccount') }}
        </button>
      </div>

      @if (activeTab() === 'signin') {
        <app-login-form
          [loading]="loading()"
          [errorMessage]="errorMessage()"
          (loginSubmit)="onLogin($event)"
        />
      }
    </div>
  </div>
</section>
