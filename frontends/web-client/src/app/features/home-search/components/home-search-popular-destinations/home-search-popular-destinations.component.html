<section id="popular-destinations" class="py-16 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-12">
      <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">
        {{ t('homeSearch.popular.title') }}
      </h2>
      <p class="text-lg text-gray-600 max-w-2xl mx-auto">{{ t('homeSearch.popular.subtitle') }}</p>
    </div>

    <div id="destinations-carousel" class="relative">
      <div class="flex space-x-6 overflow-x-auto pb-4">
        @for (destination of popularDestinations; track destination.cityCountry) {
          <div
            class="flex-shrink-0 w-80 bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-xl transition-shadow"
          >
            <div class="h-48 overflow-hidden">
              <img
                class="w-full h-full object-cover"
                [src]="destination.imageUrl"
                [alt]="destination.imageAlt"
              />
            </div>
            <div class="p-6">
              <h3 class="text-xl font-semibold text-gray-900 mb-2">
                {{ destination.cityCountry }}
              </h3>
              <p class="text-gray-600 mb-4">{{ t(destination.priceKey) }}</p>
              <span class="text-sm text-success font-medium">{{
                t(destination.availableHotelsKey)
              }}</span>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
