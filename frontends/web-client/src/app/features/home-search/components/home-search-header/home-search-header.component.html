<header id="header" class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div id="logo-section" class="flex items-center">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-plane text-white text-sm"></i>
          </div>
          <span class="text-xl font-bold text-gray-900">TravelHub</span>
        </div>
      </div>

      <!-- Navigation -->
      <nav id="main-navigation" class="hidden lg:flex items-center space-x-8">
        <a href="#" class="text-primary font-medium border-b-2 border-primary pb-1">{{ t('homeSearch.nav.travelerHome') }}</a>
        <a href="#" class="text-gray-700 hover:text-gray-900">{{ t('homeSearch.nav.searchResults') }}</a>
        <a href="#" class="text-gray-700 hover:text-gray-900">{{ t('homeSearch.nav.myReservations') }}</a>
        <a href="#" class="text-gray-700 hover:text-gray-900">{{ t('homeSearch.nav.accountPreferences') }}</a>
      </nav>

      <!-- Right side controls -->
      <div class="flex items-center space-x-4">
        <!-- Language & Currency Selector -->
        <div id="language-currency" class="hidden sm:flex items-center space-x-3">
          <select
            (ngModelChange)="onLanguageChange($event)"
            [ngModel]="currentLanguage()"
            class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500 focus:border-transparent"
          >
            <option value="en">🇺🇸 English</option>
            <option value="es">🇪🇸 Español</option>
            <option value="pt">🇧🇷 Português</option>
          </select>
          <select
            (ngModelChange)="currency.set($event)"
            [ngModel]="currency()"
            class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500 focus:border-transparent"
          >
            <option value="USD">USD</option>
            <option value="ARS">ARS</option>
            <option value="CLP">CLP</option>
            <option value="PEN">PEN</option>
            <option value="COP">COP</option>
            <option value="MXN">MXN</option>
          </select>
        </div>

        <!-- User Profile -->
        <div class="flex items-center space-x-3">
          <div class="relative">
            <button class="flex items-center space-x-2 text-sm text-gray-700 hover:text-gray-900">
              <img
                class="h-8 w-8 rounded-full"
                src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-1.jpg"
                alt="Profile"
              />
              <span class="hidden sm:block">{{ currentUser()?.nombre || currentUser()?.usuario || 'Sarah' }}</span>
              <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
