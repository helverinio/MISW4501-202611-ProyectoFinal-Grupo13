<div class="bg-gray-50 min-h-screen font-inter">
  <header id="header" class="bg-white shadow-sm border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center">
          <div class="flex-shrink-0">
            <div class="flex items-center">
              <div id="i505bu-2" class="flex items-center space-x-2">
                <div
                  id="id0g0l"
                  class="w-8 h-8 bg-primary-500 rounded-lg flex items-center justify-center"
                >
                  <i id="inobr7" class="fa-solid fa-plane text-white text-sm"></i>
                </div>
                <span id="i1r3io" class="text-xl font-bold text-gray-900">TravelHub</span>
              </div>
              <span
                class="ml-2 px-2 py-1 text-xs font-medium bg-gray-100 text-gray-600 rounded-full"
                >Admin</span
              >
            </div>
          </div>
        </div>
        <div class="flex items-center space-x-4">
          <!-- Language selector -->
          <div class="flex items-center gap-1">
            <button
              type="button"
              (click)="setLanguage('es')"
              [class]="currentLanguage === 'es' ? 'px-2 py-1 text-xs font-semibold bg-primary-100 text-primary-700 rounded-md border border-primary-300' : 'px-2 py-1 text-xs font-medium text-gray-500 hover:text-gray-700 rounded-md hover:bg-gray-100'"
            >ES</button>
            <button
              type="button"
              (click)="setLanguage('en')"
              [class]="currentLanguage === 'en' ? 'px-2 py-1 text-xs font-semibold bg-primary-100 text-primary-700 rounded-md border border-primary-300' : 'px-2 py-1 text-xs font-medium text-gray-500 hover:text-gray-700 rounded-md hover:bg-gray-100'"
            >EN</button>
            <button
              type="button"
              (click)="setLanguage('pt')"
              [class]="currentLanguage === 'pt' ? 'px-2 py-1 text-xs font-semibold bg-primary-100 text-primary-700 rounded-md border border-primary-300' : 'px-2 py-1 text-xs font-medium text-gray-500 hover:text-gray-700 rounded-md hover:bg-gray-100'"
            >PT</button>
          </div>
          <a
            href="#"
            class="text-gray-600 hover:text-primary-600 text-sm font-medium transition-colors"
            >{{ t('login.needHelp') }}</a
          >
        </div>
      </div>
    </div>
  </header>

  <main id="main-content" class="flex-1">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
      <div class="max-w-md w-full space-y-8">
        <div id="login-card" class="bg-white rounded-2xl shadow-lg p-8">
          <div id="login-header" class="text-center mb-8">
            <div class="flex justify-center mb-4">
              <div class="w-16 h-16 bg-primary-100 rounded-2xl flex items-center justify-center">
                <i class="fas fa-shield-halved text-primary-600 text-2xl"></i>
              </div>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">{{ t('login.title') }}</h2>
            <p class="text-gray-600 text-sm">{{ t('login.subtitle') }}</p>
          </div>

          <form id="login-form" class="space-y-6" [formGroup]="loginForm" (ngSubmit)="submit()">
            <div id="email-field">
              <label for="email" class="block text-sm font-medium text-gray-700 mb-2"
                >{{ t('login.email') }}</label
              >
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i class="fas fa-envelope text-gray-400 text-sm"></i>
                </div>
                <input
                  id="email"
                  name="email"
                  type="email"
                  required
                  [placeholder]="t('login.emailPlaceholder')"
                  formControlName="email"
                  class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm transition-colors"
                />
              </div>
            </div>

            <div id="password-field">
              <label for="password" class="block text-sm font-medium text-gray-700 mb-2"
                >{{ t('login.password') }}</label
              >
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i class="fas fa-lock text-gray-400 text-sm"></i>
                </div>
                <input
                  id="password"
                  name="password"
                  [type]="showPassword ? 'text' : 'password'"
                  required
                  [placeholder]="t('login.passwordPlaceholder')"
                  formControlName="password"
                  class="block w-full pl-10 pr-12 py-3 border border-gray-300 rounded-xl placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm transition-colors"
                />
                <button
                  type="button"
                  (click)="togglePassword()"
                  class="absolute inset-y-0 right-0 pr-3 flex items-center"
                >
                  <i
                    [class]="
                      showPassword
                        ? 'fas fa-eye-slash text-gray-400 text-sm hover:text-gray-600 transition-colors'
                        : 'fas fa-eye text-gray-400 text-sm hover:text-gray-600 transition-colors'
                    "
                  ></i>
                </button>
              </div>
            </div>

            <div id="mfa-field" *ngIf="showMfaField">
              <label for="mfa-code" class="block text-sm font-medium text-gray-700 mb-2"
                >{{ t('login.mfaCode') }}</label
              >
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i class="fas fa-mobile-alt text-gray-400 text-sm"></i>
                </div>
                <input
                  id="mfa-code"
                  name="mfa-code"
                  type="text"
                  maxlength="6"
                  placeholder="000000"
                  formControlName="mfaCode"
                  class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm text-center font-mono tracking-wider transition-colors"
                />
              </div>
              <p class="text-xs text-gray-500 mt-2">
                {{ t('login.mfaCodeHint') }}
              </p>
            </div>

            <div *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</div>

            <div id="remember-section" class="flex items-center justify-between">
              <div class="flex items-center">
                <input
                  id="remember-me"
                  name="remember-me"
                  type="checkbox"
                  class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded"
                />
                <label for="remember-me" class="ml-2 block text-sm text-gray-700"
                  >{{ t('login.rememberMe') }}</label
                >
              </div>
              <div class="text-sm">
                <a
                  [routerLink]="['/setup-admin']"
                  class="font-medium text-primary-600 hover:text-primary-500 transition-colors"
                  >{{ t('login.setupAdmin') }}</a
                >
              </div>
            </div>

            <div id="submit-section">
              <button
                type="submit"
                [disabled]="isSubmitting"
                class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors"
              >
                <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                  <i
                    class="fas fa-sign-in-alt text-primary-200 group-hover:text-primary-100 text-sm"
                  ></i>
                </span>
                {{ showMfaField ? t('login.verifySignIn') : t('login.signIn') }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>
