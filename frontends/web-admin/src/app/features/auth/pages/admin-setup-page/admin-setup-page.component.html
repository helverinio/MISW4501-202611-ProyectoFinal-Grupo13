<div class="min-h-screen bg-gray-50 py-10 px-4" style="font-family: 'Inter', sans-serif;">
  <div class="max-w-3xl mx-auto space-y-6">
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <h1 class="text-2xl font-bold text-gray-900 mb-4">Admin MFA Setup</h1>
      <p class="text-sm text-gray-600 mb-6">Crea un administrador, escanea el QR en Google Authenticator y verifica el código.</p>

      <form class="space-y-4" [formGroup]="registerForm" (ngSubmit)="registerAdmin()">
        <input formControlName="nombre" placeholder="Nombre" class="w-full border border-gray-300 rounded-xl px-4 py-3" />
        <input formControlName="email" type="email" placeholder="admin@travelhub.com" class="w-full border border-gray-300 rounded-xl px-4 py-3" />
        <input formControlName="contrasena" type="password" placeholder="Contraseña" class="w-full border border-gray-300 rounded-xl px-4 py-3" />
        <button type="submit" class="bg-primary-600 text-white rounded-xl px-4 py-3 w-full">Crear administrador</button>
      </form>

      <div *ngIf="registerError" class="text-sm text-red-600 mt-3">{{ registerError }}</div>
    </div>

    <div *ngIf="setupData" class="bg-white rounded-2xl shadow-lg p-8 space-y-3">
      <h2 class="text-lg font-semibold text-gray-900">Datos de enrolamiento</h2>
      <p class="text-sm text-gray-700"><strong>Setup URL:</strong> {{ setupData.setup_url }}</p>
      <p class="text-sm text-gray-700 break-all"><strong>OTPAUTH URI:</strong> {{ setupData.otpauth_uri }}</p>
      <img
        alt="QR de enrolamiento"
        class="w-56 h-56 border rounded-lg"
        [src]="qrCodeUrl"
      />

      <form class="space-y-4 mt-4" [formGroup]="verifyForm" (ngSubmit)="verifySetup()">
        <input formControlName="email" type="email" placeholder="Email admin" class="w-full border border-gray-300 rounded-xl px-4 py-3" />
        <input formControlName="code" placeholder="Código de 6 dígitos" maxlength="6" class="w-full border border-gray-300 rounded-xl px-4 py-3" />
        <button type="submit" class="bg-green-600 text-white rounded-xl px-4 py-3 w-full">Verificar setup</button>
      </form>
      <div *ngIf="verifyError" class="text-sm text-red-600">{{ verifyError }}</div>
      <div *ngIf="verifySuccess" class="text-sm text-green-700">{{ verifySuccess }}</div>
    </div>

    <a [routerLink]="['/login']" class="text-sm text-primary-600">Volver al login</a>
  </div>
</div>
