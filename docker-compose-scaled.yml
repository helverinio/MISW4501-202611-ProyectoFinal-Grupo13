version: '3.8'

services:
  # Message Broker (Amazon MQ compatible - ActiveMQ)
  activemq:
    image: apache/activemq-classic:5.18.3
    environment:
      ACTIVEMQ_USERNAME: admin
      ACTIVEMQ_PASSWORD: admin
    ports:
      - "61616:61616"  # OpenWire
      - "61613:61613"  # STOMP
      - "8161:8161"    # Web Console
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8161/admin/ -u admin:admin || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  # Redis for Distributed Locking
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  # Databases
  reservas-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reservas
    volumes:
      - reservas-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ext-payments-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ext_payments
    volumes:
      - ext-payments-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pagos-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pagos
    volumes:
      - pagos-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Reservas instances (scaled for load balancing)
  reservas-1:
    build:
      context: ./microservices/reservas
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@reservas-db:5432/reservas
      PAGOS_SERVICE_URL: http://pagos:5002
      MQ_HOST: activemq
      MQ_PORT: 61613
      MQ_USERNAME: admin
      MQ_PASSWORD: admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_LOCK_TIMEOUT_SECONDS: 30
    depends_on:
      reservas-db:
        condition: service_healthy
      pagos:
        condition: service_started
      activemq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  reservas-2:
    build:
      context: ./microservices/reservas
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@reservas-db:5432/reservas
      PAGOS_SERVICE_URL: http://pagos:5002
      MQ_HOST: activemq
      MQ_PORT: 61613
      MQ_USERNAME: admin
      MQ_PASSWORD: admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_LOCK_TIMEOUT_SECONDS: 30
    depends_on:
      reservas-db:
        condition: service_healthy
      pagos:
        condition: service_started
      activemq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  reservas-3:
    build:
      context: ./microservices/reservas
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@reservas-db:5432/reservas
      PAGOS_SERVICE_URL: http://pagos:5002
      MQ_HOST: activemq
      MQ_PORT: 61613
      MQ_USERNAME: admin
      MQ_PASSWORD: admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_LOCK_TIMEOUT_SECONDS: 30
    depends_on:
      reservas-db:
        condition: service_healthy
      pagos:
        condition: service_started
      activemq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  ext-payments:
    build:
      context: ./microservices/ext-payments
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@ext-payments-db:5432/ext_payments
    ports:
      - "5001:5001"
    depends_on:
      ext-payments-db:
        condition: service_healthy
    restart: on-failure

  pagos:
    build:
      context: ./microservices/pagos
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@pagos-db:5432/pagos
      EXT_PAYMENTS_URL: http://ext-payments:5001
      PAGOS_WEBHOOK_URL: http://nginx:80
      MQ_HOST: activemq
      MQ_PORT: 61613
      MQ_USERNAME: admin
      MQ_PASSWORD: admin
      MQ_MAX_RETRIES: 3
      MQ_DLQ_TOPIC: /topic/PaymentStatusUpdated.DLQ
    ports:
      - "5002:5002"
    depends_on:
      pagos-db:
        condition: service_healthy
      ext-payments:
        condition: service_started
      activemq:
        condition: service_healthy
    restart: on-failure

  # Gateway instances (scaled for load balancing)
  gateway-1:
    build:
      context: ./microservices/gateway
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: development
      RESERVAS_SERVICE_URL: http://reservas-1:5000
      PAGOS_SERVICE_URL: http://pagos:5002
      GUNICORN_WORKERS: 4
      GUNICORN_THREADS: 2
    depends_on:
      - reservas-1
      - reservas-2
      - reservas-3
      - pagos
    restart: on-failure

  gateway-2:
    build:
      context: ./microservices/gateway
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: development
      RESERVAS_SERVICE_URL: http://reservas-2:5000
      PAGOS_SERVICE_URL: http://pagos:5002
      GUNICORN_WORKERS: 4
      GUNICORN_THREADS: 2
    depends_on:
      - reservas-1
      - reservas-2
      - reservas-3
      - pagos
    restart: on-failure

  gateway-3:
    build:
      context: ./microservices/gateway
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: development
      RESERVAS_SERVICE_URL: http://reservas-3:5000
      PAGOS_SERVICE_URL: http://pagos:5002
      GUNICORN_WORKERS: 4
      GUNICORN_THREADS: 2
    depends_on:
      - reservas-1
      - reservas-2
      - reservas-3
      - pagos
    restart: on-failure

  # Nginx Load Balancer
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3
      - reservas-1
      - reservas-2
      - reservas-3
    restart: on-failure

volumes:
  reservas-db-data:
  ext-payments-db-data:
  pagos-db-data:
  redis-data:
