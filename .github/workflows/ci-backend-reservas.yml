name: Backend CI - reservas

on:
  # GitFlow push branches for CI validation.
  push:
    branches:
      - develop
      - feature/**
      - release/**
      - hotfix/**
    # Run only when reservas or its CI definitions change.
    paths:
      - microservices/reservas/**
      - .github/workflows/ci-backend-reservas.yml
      - .github/workflows/_python-service-ci.yml
  # PR validation gates into integration and production branches.
  pull_request:
    branches:
      - develop
      - main
    # Run only when reservas or its CI definitions change.
    paths:
      - microservices/reservas/**
      - .github/workflows/ci-backend-reservas.yml
      - .github/workflows/_python-service-ci.yml

jobs:
  reservas-ci:
    # Calls the shared Python CI template to avoid duplication.
    name: reservas
    uses: ./.github/workflows/_python-service-ci.yml
    with:
      service_name: reservas
      service_path: microservices/reservas
