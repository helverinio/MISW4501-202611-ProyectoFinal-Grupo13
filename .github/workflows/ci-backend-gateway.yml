name: Backend CI - gateway

on:
  # GitFlow push branches for CI validation.
  push:
    branches:
      - develop
      - feature/**
      - release/**
      - hotfix/**
    # Run only when gateway or its CI definitions change.
    paths:
      - microservices/gateway/**
      - .github/workflows/ci-backend-gateway.yml
      - .github/workflows/_python-service-ci.yml
  # PR validation gates into integration and production branches.
  pull_request:
    branches:
      - develop
      - main
    # Run only when gateway or its CI definitions change.
    paths:
      - microservices/gateway/**
      - .github/workflows/ci-backend-gateway.yml
      - .github/workflows/_python-service-ci.yml

jobs:
  gateway-ci:
    # Calls the shared Python CI template to avoid duplication.
    name: gateway
    uses: ./.github/workflows/_python-service-ci.yml
    with:
      service_name: gateway
      service_path: microservices/gateway
