name: Backend CI - pagos

on:
  # GitFlow push branches for CI validation.
  push:
    branches:
      - develop
      - feature/**
      - release/**
      - hotfix/**
    # Run only when pagos or its CI definitions change.
    paths:
      - microservices/pagos/**
      - .github/workflows/ci-backend-pagos.yml
      - .github/workflows/_python-service-ci.yml
  # PR validation gates into integration and production branches.
  pull_request:
    branches:
      - develop
      - main
    # Run only when pagos or its CI definitions change.
    paths:
      - microservices/pagos/**
      - .github/workflows/ci-backend-pagos.yml
      - .github/workflows/_python-service-ci.yml

jobs:
  pagos-ci:
    # Calls the shared Python CI template to avoid duplication.
    name: pagos
    uses: ./.github/workflows/_python-service-ci.yml
    with:
      service_name: pagos
      service_path: microservices/pagos
