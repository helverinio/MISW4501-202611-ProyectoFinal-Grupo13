name: Frontend CI - web-admin

on:
  # GitFlow push branches for CI validation.
  push:
    branches:
      - develop
      - feature/**
      - release/**
      - hotfix/**
    # Run only when web-admin or its CI definitions change.
    paths:
      - frontends/web-admin/**
      - .github/workflows/ci-frontend-web-admin.yml
      - .github/workflows/_frontend-ci.yml
  # PR validation gates into integration and production branches.
  pull_request:
    branches:
      - develop
      - main
    # Run only when web-admin or its CI definitions change.
    paths:
      - frontends/web-admin/**
      - .github/workflows/ci-frontend-web-admin.yml
      - .github/workflows/_frontend-ci.yml

jobs:
  web-admin-ci:
    # Calls the shared frontend CI template.
    name: web-admin
    uses: ./.github/workflows/_frontend-ci.yml
    with:
      app_name: web-admin
      app_path: frontends/web-admin
