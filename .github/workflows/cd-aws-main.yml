name: CD AWS - main

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-aws-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TF_IN_AUTOMATION: true
      TF_VAR_aws_region: us-east-2
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_emailjs_service_id: ${{ vars.EMAILJS_SERVICE_ID }}
      TF_VAR_emailjs_public_key: ${{ vars.EMAILJS_PUBLIC_KEY }}
      TF_VAR_emailjs_private_key: ${{ secrets.EMAILJS_PRIVATE_KEY }}
      TF_VAR_emailjs_verification_template_id: ${{ vars.EMAILJS_VERIFICATION_TEMPLATE_ID }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY }}
      TF_BACKEND_DYNAMODB_TABLE: ${{ vars.TF_BACKEND_DYNAMODB_TABLE }}
      EMAILJS_SERVICE_ID: ${{ vars.EMAILJS_SERVICE_ID }}
      EMAILJS_PUBLIC_KEY: ${{ vars.EMAILJS_PUBLIC_KEY }}
      EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
      EMAILJS_VERIFICATION_TEMPLATE_ID: ${{ vars.EMAILJS_VERIFICATION_TEMPLATE_ID }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-2
          role-duration-seconds: 3600

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform backend config
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TF_BACKEND_BUCKET}"
          test -n "${TF_BACKEND_KEY}"
          test -n "${TF_BACKEND_DYNAMODB_TABLE}"

      - name: Terraform init
        working-directory: infra/aws/terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="region=${TF_VAR_aws_region}" \
            -backend-config="dynamodb_table=${TF_BACKEND_DYNAMODB_TABLE}" \
            -backend-config="encrypt=true"

      - name: Migrate ext-payments ECS state to dedicated resource
        working-directory: infra/aws/terraform
        run: |
          # Move the ext-payments service from the for_each resource to the dedicated resource
          # so Terraform recreates it with deployment_controller=ECS instead of CODE_DEPLOY.
          # This is idempotent: if already moved, `state show` will fail and we skip gracefully.
          if terraform state show 'aws_ecs_service.services["ext-payments"]' > /dev/null 2>&1; then
            echo "Moving aws_ecs_service.services[ext-payments] → aws_ecs_service.ext_payments"
            terraform state mv 'aws_ecs_service.services["ext-payments"]' 'aws_ecs_service.ext_payments' || true
          else
            echo "aws_ecs_service.services[ext-payments] not in state (already moved or never existed) – skipping"
          fi
          # Same for autoscaling target
          if terraform state show 'aws_appautoscaling_target.services["ext-payments"]' > /dev/null 2>&1; then
            echo "Moving aws_appautoscaling_target.services[ext-payments] → aws_appautoscaling_target.ext_payments"
            terraform state mv 'aws_appautoscaling_target.services["ext-payments"]' 'aws_appautoscaling_target.ext_payments' || true
          else
            echo "aws_appautoscaling_target.services[ext-payments] not in state – skipping"
          fi
          # Same for autoscaling policy
          if terraform state show 'aws_appautoscaling_policy.services_cpu["ext-payments"]' > /dev/null 2>&1; then
            echo "Moving aws_appautoscaling_policy.services_cpu[ext-payments] → aws_appautoscaling_policy.ext_payments_cpu"
            terraform state mv 'aws_appautoscaling_policy.services_cpu["ext-payments"]' 'aws_appautoscaling_policy.ext_payments_cpu' || true
          else
            echo "aws_appautoscaling_policy.services_cpu[ext-payments] not in state – skipping"
          fi

      - name: Terraform apply
        working-directory: infra/aws/terraform
        run: terraform apply -lock-timeout=15m -auto-approve

      - name: Capture Terraform outputs
        working-directory: infra/aws/terraform
        run: terraform output -json > tf-outputs.json

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend images
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          TF_OUTPUTS="infra/aws/terraform/tf-outputs.json"

          build_and_push() {
            local service="$1"
            local path="$2"
            local repo
            repo=$(jq -r --arg s "$service" '.ecr_repositories.value[$s]' "$TF_OUTPUTS")

            echo "Building $service -> $repo:${GITHUB_SHA}"
            docker build -t "$repo:${GITHUB_SHA}" "$path"
            docker tag "$repo:${GITHUB_SHA}" "$repo:latest"
            docker push "$repo:${GITHUB_SHA}"
            docker push "$repo:latest"
          }

          build_and_push gateway microservices/gateway
          build_and_push reservas microservices/reservas
          build_and_push pagos microservices/pagos
          build_and_push ext-payments microservices/ext-payments
          build_and_push usuarios microservices/usuarios

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontends/web-client/package-lock.json
            frontends/web-admin/package-lock.json

      - name: Build Angular frontends
        shell: bash
        run: |
          set -euo pipefail
          pushd frontends/web-client
          npm ci
          npm run build -- --configuration production
          popd

          pushd frontends/web-admin
          npm ci
          npm run build -- --configuration production
          popd

      - name: Publish frontends to S3 and invalidate CloudFront
        shell: bash
        run: |
          set -euo pipefail
          TF_OUTPUTS="infra/aws/terraform/tf-outputs.json"

          WEB_CLIENT_BUCKET=$(jq -r '.frontend_buckets.value["web-client"]' "$TF_OUTPUTS")
          WEB_ADMIN_BUCKET=$(jq -r '.frontend_buckets.value["web-admin"]' "$TF_OUTPUTS")
          WEB_CLIENT_DIST=$(jq -r '.frontend_cloudfront_distribution_ids.value["web-client"]' "$TF_OUTPUTS")
          WEB_ADMIN_DIST=$(jq -r '.frontend_cloudfront_distribution_ids.value["web-admin"]' "$TF_OUTPUTS")

          WEB_CLIENT_DIST_DIR=$(find frontends/web-client/dist -type d -name browser | head -n 1)
          WEB_ADMIN_DIST_DIR=$(find frontends/web-admin/dist -type d -name browser | head -n 1)

          aws s3 sync "$WEB_CLIENT_DIST_DIR/" "s3://$WEB_CLIENT_BUCKET/" --delete
          aws s3 sync "$WEB_ADMIN_DIST_DIR/" "s3://$WEB_ADMIN_BUCKET/" --delete

          aws cloudfront create-invalidation --distribution-id "$WEB_CLIENT_DIST" --paths '/*'
          aws cloudfront create-invalidation --distribution-id "$WEB_ADMIN_DIST" --paths '/*'

      - name: Deploy ECS services with CodeDeploy blue-green
        shell: bash
        run: |
          set -euo pipefail
          TF_OUTPUTS="infra/aws/terraform/tf-outputs.json"
          DEPLOY_TIMEOUT_SECONDS=$((3 * 60 * 60))
          DEPLOY_DEADLINE=$(( $(date +%s) + DEPLOY_TIMEOUT_SECONDS ))

          AWS_REGION=$(jq -r '.aws_region.value' "$TF_OUTPUTS")
          EXEC_ROLE_ARN=$(jq -r '.ecs_task_execution_role_arn.value' "$TF_OUTPUTS")
          TASK_ROLE_ARN=$(jq -r '.ecs_task_role_arn.value' "$TF_OUTPUTS")
          SECRET_ARN=$(jq -r '.app_config_secret_arn.value' "$TF_OUTPUTS")
          INTERNAL_ALB_DNS=$(jq -r '.internal_alb_dns_name.value' "$TF_OUTPUTS")
          PUBLIC_ALB_DNS=$(jq -r '.public_alb_dns_name.value' "$TF_OUTPUTS")
          REDIS_HOST=$(jq -r '.redis_primary_endpoint.value' "$TF_OUTPUTS")
          MQ_HOST=$(jq -r '.mq_host.value' "$TF_OUTPUTS")
          MQ_PORT=$(jq -r '.mq_port.value' "$TF_OUTPUTS")
          FRONTEND_CORS_ORIGINS=$(jq -r '.frontend_urls.value | to_entries | map(.value) | join(",")' "$TF_OUTPUTS")
          WEBCLIENT_URL=$(jq -r '.frontend_urls.value["web-client"]' "$TF_OUTPUTS")

          reconcile_listener() {
            local service="$1"
            local cluster_name service_name prod_listener_arn expected_target_group current_target_group

            cluster_name=$(jq -r '.ecs_cluster_name.value' "$TF_OUTPUTS")
            service_name=$(jq -r --arg s "$service" '.ecs_services.value[$s]' "$TF_OUTPUTS")
            prod_listener_arn=$(jq -r --arg s "$service" '.codedeploy_prod_listener_arns.value[$s]' "$TF_OUTPUTS")

            service_name="${service_name//$'\r'/}"
            prod_listener_arn="${prod_listener_arn//$'\r'/}"

            if [[ "$service_name" == "null" || -z "$service_name" ]]; then
              echo "Skipping listener reconcile for $service: ECS service name not found"
              return 0
            fi

            if [[ "$prod_listener_arn" == "null" || -z "$prod_listener_arn" || "$prod_listener_arn" != arn:aws*:elasticloadbalancing:*:listener/* ]]; then
              echo "Skipping listener reconcile for $service: no CodeDeploy listener configured"
              return 0
            fi

            expected_target_group=$(aws ecs describe-services \
              --cluster "$cluster_name" \
              --services "$service_name" \
              --query 'services[0].loadBalancers[0].targetGroupArn' \
              --output text)

            current_target_group=$(aws elbv2 describe-listeners \
              --listener-arns "$prod_listener_arn" \
              --query 'Listeners[0].DefaultActions[0].TargetGroupArn' \
              --output text)

            if [ -z "$expected_target_group" ] || [ "$expected_target_group" = "None" ]; then
              echo "Could not determine primary target group for $service"
              exit 1
            fi

            if [ "$current_target_group" != "$expected_target_group" ]; then
              echo "Re-aligning prod listener for $service"
              aws elbv2 modify-listener \
                --listener-arn "$prod_listener_arn" \
                --default-actions Type=forward,TargetGroupArn="$expected_target_group" >/dev/null
            fi
          }

          render_taskdef() {
            local service="$1"
            local image_uri="$2"
            local family="$3"
            local log_group="$4"
            local template="infra/aws/terraform/taskdefs/${service}.json.tpl"
            local output_file="/tmp/${service}-taskdef.json"

            cp "$template" "$output_file"

            replace_placeholder() {
              local placeholder="$1"
              local value="$2"
              local escaped
              escaped=$(printf '%s' "$value" | sed -e 's/[\\|&]/\\&/g')
              sed -i "s|${placeholder}|${escaped}|g" "$output_file"
            }

            replace_placeholder "__FAMILY__" "$family"
            replace_placeholder "__EXEC_ROLE_ARN__" "$EXEC_ROLE_ARN"
            replace_placeholder "__TASK_ROLE_ARN__" "$TASK_ROLE_ARN"
            replace_placeholder "__IMAGE_URI__" "$image_uri"
            replace_placeholder "__SECRET_ARN__" "$SECRET_ARN"
            replace_placeholder "__LOG_GROUP__" "$log_group"
            replace_placeholder "__AWS_REGION__" "$AWS_REGION"
            replace_placeholder "__INTERNAL_ALB_DNS__" "$INTERNAL_ALB_DNS"
            replace_placeholder "__PUBLIC_ALB_DNS__" "$PUBLIC_ALB_DNS"
            replace_placeholder "__REDIS_HOST__" "$REDIS_HOST"
            replace_placeholder "__MQ_HOST__" "$MQ_HOST"
            replace_placeholder "__MQ_PORT__" "$MQ_PORT"
            replace_placeholder "__CORS_ORIGINS__" "$FRONTEND_CORS_ORIGINS"
            replace_placeholder "__WEBCLIENT_URL__" "$WEBCLIENT_URL"
            replace_placeholder "__EMAILJS_SERVICE_ID__" "${EMAILJS_SERVICE_ID:-}"
            replace_placeholder "__EMAILJS_PUBLIC_KEY__" "${EMAILJS_PUBLIC_KEY:-}"
            replace_placeholder "__EMAILJS_PRIVATE_KEY__" "${EMAILJS_PRIVATE_KEY:-}"
            replace_placeholder "__EMAILJS_TEMPLATE_ID__" "${EMAILJS_VERIFICATION_TEMPLATE_ID:-}"

            if grep -Eq '__[A-Z0-9_]+__' "$output_file"; then
              echo "Unresolved placeholders detected in ${output_file}"
              grep -Eo '__[A-Z0-9_]+__' "$output_file" | sort -u
              exit 1
            fi

            echo "$output_file"
          }

          deploy_service() {
            local service="$1"
            local image_repo family log_group app_name group_name port image_uri taskdef_file taskdef_arn appspec_file deploy_input_file deployment_id status cluster_name service_name

            image_repo=$(jq -r --arg s "$service" '.ecr_repositories.value[$s]' "$TF_OUTPUTS")
            family=$(jq -r --arg s "$service" '.service_families.value[$s]' "$TF_OUTPUTS")
            log_group=$(jq -r --arg s "$service" '.log_groups.value[$s]' "$TF_OUTPUTS")
            app_name=$(jq -r --arg s "$service" '.codedeploy_apps.value[$s]' "$TF_OUTPUTS")
            group_name=$(jq -r --arg s "$service" '.codedeploy_deployment_groups.value[$s]' "$TF_OUTPUTS")
            port=$(jq -r --arg s "$service" '.service_ports.value[$s]' "$TF_OUTPUTS")
            image_uri="$image_repo:${GITHUB_SHA}"

            taskdef_file=$(render_taskdef "$service" "$image_uri" "$family" "$log_group")
            taskdef_arn=$(aws ecs register-task-definition --cli-input-json "file://$taskdef_file" --query 'taskDefinition.taskDefinitionArn' --output text)

            app_name="${app_name//$'\r'/}"
            group_name="${group_name//$'\r'/}"

            if [[ "$app_name" == "null" || "$group_name" == "null" || -z "$app_name" || -z "$group_name" ]]; then
              cluster_name=$(jq -r '.ecs_cluster_name.value' "$TF_OUTPUTS")
              service_name=$(jq -r --arg s "$service" '.ecs_services.value[$s]' "$TF_OUTPUTS")
              service_name="${service_name//$'\r'/}"
              echo "CodeDeploy not configured for $service. Using ECS rolling deployment."
              aws ecs update-service \
                --cluster "$cluster_name" \
                --service "$service_name" \
                --task-definition "$taskdef_arn" \
                --force-new-deployment >/dev/null
              return 0
            fi

            appspec_file="/tmp/${service}-appspec.json"
            jq -n --arg taskdef "$taskdef_arn" --arg container "$service" --argjson port "$port" '{version:1,Resources:[{TargetService:{Type:"AWS::ECS::Service",Properties:{TaskDefinition:$taskdef,LoadBalancerInfo:{ContainerName:$container,ContainerPort:$port},PlatformVersion:"LATEST"}}}]}' > "$appspec_file"

            deploy_input_file="/tmp/${service}-deployment.json"
            jq -n --arg app "$app_name" --arg group "$group_name" --arg desc "Deploy ${service} ${GITHUB_SHA}" --arg content "$(cat "$appspec_file")" '{applicationName:$app,deploymentGroupName:$group,description:$desc,revision:{revisionType:"AppSpecContent",appSpecContent:{content:$content}}}' > "$deploy_input_file"

            deployment_id=$(aws deploy create-deployment --cli-input-json "file://$deploy_input_file" --query 'deploymentId' --output text)
            echo "Started deployment for $service: $deployment_id"

            while true; do
              status=$(aws deploy get-deployment --deployment-id "$deployment_id" --query 'deploymentInfo.status' --output text)
              echo "$service deployment status: $status"

              if [ "$status" = "Succeeded" ]; then
                break
              fi

              if [ "$status" = "Failed" ] || [ "$status" = "Stopped" ]; then
                echo "Deployment for $service failed with status $status"
                exit 1
              fi

              if [ "$(date +%s)" -ge "$DEPLOY_DEADLINE" ]; then
                echo "Timed out waiting for deployment of $service"
                exit 1
              fi

              sleep 5
            done
          }

          for service in gateway reservas pagos ext-payments usuarios; do
            reconcile_listener "$service"
          done

          services=(ext-payments usuarios pagos reservas gateway)
          pids=()

          for service in "${services[@]}"; do
            deploy_service "$service" &
            pids+=("$!")
          done

          failed=0
          for index in "${!pids[@]}"; do
            if ! wait "${pids[$index]}"; then
              echo "Deployment process failed for ${services[$index]}"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "All deployments completed successfully"
