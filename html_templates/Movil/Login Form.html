<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> window.FontAwesomeConfig = { autoReplaceSvg: 'nest'};</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif']
                    },
                    colors: {
                        'blue-primary': '#2563eb',
                        'blue-hover': '#1d4ed8',
                        'green-success': '#10b981',
                        'gray-text': '#6b7280',
                        'gray-border': '#e5e7eb'
                    }
                }
            }
        }
    </script>
    <style>::-webkit-scrollbar { display: none;}</style>
</head>
<body class="font-inter bg-white">

    <div id="mobile-app-container" class="max-w-sm mx-auto bg-white min-h-screen">
        
        <!-- Header -->
        <header id="header" class="px-6 pt-8 pb-4">
            <div class="flex items-center justify-center mb-8">
                <div class="text-2xl font-bold text-blue-primary">
                    <i class="fa-solid fa-suitcase-rolling mr-2"></i>
                    TravelHub
                </div>
            </div>
        </header>

        <!-- Tab Navigation -->
        <div id="tab-navigation" class="px-6 mb-6">
            <div class="flex bg-gray-100 rounded-lg p-1">
                <button id="login-tab" class="flex-1 py-3 text-center text-sm font-medium rounded-md bg-white text-blue-primary shadow-sm transition-all">
                    Iniciar Sesión
                </button>
                <button id="signup-tab" class="flex-1 py-3 text-center text-sm font-medium rounded-md text-gray-text transition-all">
                    Crear Cuenta
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="px-6">
            <form class="space-y-5">
                
                <!-- Email Input -->
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-900 mb-2">Correo electrónico</label>
                    <div class="relative">
                        <input type="email" 
                               class="w-full px-4 py-3 border border-gray-border rounded-lg focus:ring-2 focus:ring-blue-primary focus:border-transparent outline-none text-gray-900 placeholder-gray-400"
                               placeholder="tu@email.com">
                        <i class="fa-regular fa-envelope absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-900 mb-2">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="password-input"
                               class="w-full px-4 py-3 border border-gray-border rounded-lg focus:ring-2 focus:ring-blue-primary focus:border-transparent outline-none text-gray-900 placeholder-gray-400"
                               placeholder="••••••••">
                        <button type="button" id="toggle-password" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="w-4 h-4 text-blue-primary border-gray-border rounded focus:ring-blue-primary">
                        <span class="ml-2 text-sm text-gray-text">Recordarme</span>
                    </label>
                    <button type="button" id="forgot-password-btn" class="text-sm text-blue-primary font-medium">
                        ¿Olvidaste tu contraseña?
                    </button>
                </div>

                <!-- Login Button -->
                <button type="submit" class="w-full bg-blue-primary hover:bg-blue-hover text-white font-medium py-3 rounded-lg transition-colors shadow-sm">
                    Iniciar Sesión
                </button>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-border"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-text">o continúa con</span>
                    </div>
                </div>

                <!-- Social Login -->
                <div class="space-y-3">
                    <button type="button" class="w-full flex items-center justify-center px-4 py-3 border border-gray-border rounded-lg hover:bg-gray-50 transition-colors">
                        <i class="fa-brands fa-google text-red-500 mr-3"></i>
                        <span class="text-gray-900 font-medium">Google</span>
                    </button>
                    <button type="button" class="w-full flex items-center justify-center px-4 py-3 border border-gray-border rounded-lg hover:bg-gray-50 transition-colors">
                        <i class="fa-brands fa-facebook text-blue-600 mr-3"></i>
                        <span class="text-gray-900 font-medium">Facebook</span>
                    </button>
                </div>

            </form>
        </div>

        <!-- Sign Up Form (Hidden by default) -->
        <div id="signup-form" class="px-6 hidden">
            <form class="space-y-5">
                
                <!-- Full Name Input -->
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-900 mb-2">Nombre completo</label>
                    <div class="relative">
                        <input type="text" 
                               class="w-full px-4 py-3 border border-gray-border rounded-lg focus:ring-2 focus:ring-blue-primary focus:border-transparent outline-none text-gray-900 placeholder-gray-400"
                               placeholder="Juan Pérez">
                        <i class="fa-regular fa-user absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>

                <!-- Email Input -->
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-900 mb-2">Correo electrónico</label>
                    <div class="relative">
                        <input type="email" 
                               class="w-full px-4 py-3 border border-gray-border rounded-lg focus:ring-2 focus:ring-blue-primary focus:border-transparent outline-none text-gray-900 placeholder-gray-400"
                               placeholder="tu@email.com">
                        <i class="fa-regular fa-envelope absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-900 mb-2">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="signup-password-input"
                               class="w-full px-4 py-3 border border-gray-border rounded-lg focus:ring-2 focus:ring-blue-primary focus:border-transparent outline-none text-gray-900 placeholder-gray-400"
                               placeholder="••••••••">
                        <button type="button" id="toggle-signup-password" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <p class="text-xs text-gray-text mt-1">Mínimo 8 caracteres</p>
                </div>

                <!-- Terms and Conditions -->
                <div class="flex items-start">
                    <input type="checkbox" class="w-4 h-4 text-blue-primary border-gray-border rounded focus:ring-blue-primary mt-1">
                    <span class="ml-2 text-sm text-gray-text">
                        Acepto los <button type="button" class="text-blue-primary font-medium">términos y condiciones</button> y la <button type="button" class="text-blue-primary font-medium">política de privacidad</button>
                    </span>
                </div>

                <!-- Create Account Button -->
                <button type="submit" class="w-full bg-blue-primary hover:bg-blue-hover text-white font-medium py-3 rounded-lg transition-colors shadow-sm">
                    Crear Cuenta
                </button>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-border"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-text">o continúa con</span>
                    </div>
                </div>

                <!-- Social Login -->
                <div class="space-y-3">
                    <button type="button" class="w-full flex items-center justify-center px-4 py-3 border border-gray-border rounded-lg hover:bg-gray-50 transition-colors">
                        <i class="fa-brands fa-google text-red-500 mr-3"></i>
                        <span class="text-gray-900 font-medium">Google</span>
                    </button>
                    <button type="button" class="w-full flex items-center justify-center px-4 py-3 border border-gray-border rounded-lg hover:bg-gray-50 transition-colors">
                        <i class="fa-brands fa-facebook text-blue-600 mr-3"></i>
                        <span class="text-gray-900 font-medium">Facebook</span>
                    </button>
                </div>

            </form>
        </div>

        <!-- Forgot Password Modal -->
        <div id="forgot-password-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-6 hidden z-50">
            <div class="bg-white rounded-2xl p-6 w-full max-w-sm">
                <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fa-solid fa-key text-blue-primary text-xl"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-gray-900 mb-2">¿Olvidaste tu contraseña?</h3>
                    <p class="text-gray-text text-sm">Te enviaremos un enlace para restablecer tu contraseña</p>
                </div>

                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-900 mb-2">Correo electrónico</label>
                        <input type="email" 
                               class="w-full px-4 py-3 border border-gray-border rounded-lg focus:ring-2 focus:ring-blue-primary focus:border-transparent outline-none text-gray-900 placeholder-gray-400"
                               placeholder="tu@email.com">
                    </div>

                    <div class="flex space-x-3">
                        <button type="button" id="cancel-forgot-password" class="flex-1 py-3 border border-gray-border text-gray-900 rounded-lg font-medium hover:bg-gray-50 transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" class="flex-1 py-3 bg-blue-primary text-white rounded-lg font-medium hover:bg-blue-hover transition-colors">
                            Enviar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Trust Elements -->
        <div id="trust-elements" class="px-6 mt-8 pb-8">
            <div class="text-center">
                <div class="flex items-center justify-center space-x-6 mb-4">
                    <div class="flex items-center text-xs text-gray-text">
                        <i class="fa-solid fa-shield-halved text-green-success mr-1"></i>
                        <span>Seguro</span>
                    </div>
                    <div class="flex items-center text-xs text-gray-text">
                        <i class="fa-solid fa-lock text-green-success mr-1"></i>
                        <span>Encriptado</span>
                    </div>
                    <div class="flex items-center text-xs text-gray-text">
                        <i class="fa-solid fa-certificate text-green-success mr-1"></i>
                        <span>Certificado</span>
                    </div>
                </div>
                <p class="text-xs text-gray-text">Tus datos están protegidos con encriptación de nivel bancario</p>
            </div>
        </div>

    </div>

    <script>
        // Tab switching functionality
        const loginTab = document.getElementById('login-tab');
        const signupTab = document.getElementById('signup-tab');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');

        loginTab.addEventListener('click', function() {
            loginTab.classList.add('bg-white', 'text-blue-primary', 'shadow-sm');
            loginTab.classList.remove('text-gray-text');
            signupTab.classList.remove('bg-white', 'text-blue-primary', 'shadow-sm');
            signupTab.classList.add('text-gray-text');
            
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
        });

        signupTab.addEventListener('click', function() {
            signupTab.classList.add('bg-white', 'text-blue-primary', 'shadow-sm');
            signupTab.classList.remove('text-gray-text');
            loginTab.classList.remove('bg-white', 'text-blue-primary', 'shadow-sm');
            loginTab.classList.add('text-gray-text');
            
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        });

        // Password toggle functionality
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password-input');
        
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            const icon = this.querySelector('i');
            if (type === 'password') {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        });

        // Signup password toggle
        const toggleSignupPassword = document.getElementById('toggle-signup-password');
        const signupPasswordInput = document.getElementById('signup-password-input');
        
        toggleSignupPassword.addEventListener('click', function() {
            const type = signupPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            signupPasswordInput.setAttribute('type', type);
            
            const icon = this.querySelector('i');
            if (type === 'password') {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        });

        // Forgot password modal
        const forgotPasswordBtn = document.getElementById('forgot-password-btn');
        const forgotPasswordModal = document.getElementById('forgot-password-modal');
        const cancelForgotPassword = document.getElementById('cancel-forgot-password');

        forgotPasswordBtn.addEventListener('click', function() {
            forgotPasswordModal.classList.remove('hidden');
        });

        cancelForgotPassword.addEventListener('click', function() {
            forgotPasswordModal.classList.add('hidden');
        });

        // Close modal on backdrop click
        forgotPasswordModal.addEventListener('click', function(e) {
            if (e.target === forgotPasswordModal) {
                forgotPasswordModal.classList.add('hidden');
            }
        });
    </script>

</body>
</html>
