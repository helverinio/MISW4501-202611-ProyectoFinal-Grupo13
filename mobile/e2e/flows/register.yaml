appId: com.travelhub.app
---
# Register Flow E2E Test
# Tests the registration functionality

- launchApp:
    clearState: true

- assertVisible:
    id: "login-screen"

# Navigate to register tab
- tapOn:
    id: "register-tab"

# Test 1: Empty fields validation
- tapOn:
    id: "register-submit-button"

- assertVisible:
    id: "register-error-text"

# Test 2: Fill name only
- tapOn:
    id: "register-name-input"
- inputText: "Test User"
- hideKeyboard

- tapOn:
    id: "register-submit-button"

- assertVisible:
    id: "register-error-text"

# Test 3: Password mismatch
- tapOn:
    id: "register-email-input"
- inputText: "newuser@test.com"
- hideKeyboard

- tapOn:
    id: "register-password-input"
- inputText: "password123"
- hideKeyboard

- tapOn:
    id: "register-confirm-password-input"
- inputText: "differentpassword"
- hideKeyboard

- tapOn:
    id: "register-submit-button"

- assertVisible:
    id: "register-error-text"

# Test 4: Short password validation
- clearState:
    appId: com.travelhub.app
- launchApp

- tapOn:
    id: "register-tab"

- tapOn:
    id: "register-name-input"
- inputText: "Test User"
- hideKeyboard

- tapOn:
    id: "register-email-input"
- inputText: "newuser@test.com"
- hideKeyboard

- tapOn:
    id: "register-password-input"
- inputText: "123"
- hideKeyboard

- tapOn:
    id: "register-confirm-password-input"
- inputText: "123"
- hideKeyboard

- tapOn:
    id: "register-submit-button"

- assertVisible:
    id: "register-error-text"
